    Patents and Innovations:
      - name: System and Method for Tokenization of Anatomical Structures for Medical Imaging
        summary: Anatomy-aware tokenization of 2D/3D medical images as semantic disentangled token groups.
      - name: System and Method for Synthesizing 3D Volumetric Medical Images
        summary: Pose-conditioned diffusion models synthesizing high-resolution 3D CT-like volumes from 2D radiographs.
      - name: Automated Detection and Management of Valvular Heart Disease Using Machine Learning
        start_date: 2024
        summary: Aortic Stenosis Ensemble Risk Prediction (AS-ERP) model for length-of-stay and readmission prediction from EMR.
      - name: Machine Learning Model for Prediction of Early Discharge after TAVR
        start_date: 2023
        summary: Predicts early discharge (<36h) after transcatheter aortic valve replacement from in-house EMR data.
      - name: "PETNet: Predicting Alzheimer's Disease by Hierarchical Graph Convolution from PET Imaging"
        start_date: 2021
        summary: Graph convolutional network for automatic AD and MCI diagnosis from PET imaging.
      - name: Brain Image Analysis by Graph-based Matched Signal Detection
        start_date: 2021
        summary: MSD algorithm identifying graph-signal subspaces via Laplacian eigenvectors.
      - name: Inference of 3D Chest CT Images from 2D Chest Radiographs
        start_date: 2019
        summary: Trans-dimensional 2D-3D mapping learned from paired radiograph/CT data. Filed as Invention Disclosure.
      - name: Automatic Pre-screening Method for Pneumothorax Detection
        start_date: 2017
        summary: Software system detecting pneumothorax from CT, validated by multiple radiologists. Filed as Invention Disclosure to Partners HealthCare.
